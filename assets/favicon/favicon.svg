<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0A0A0A"/>
  <!-- GG mark: two mirrored octagons, fill-rule="evenodd" punches G counters -->
  <svg x="26" y="146" width="460" height="220" viewBox="0 0 208 100" preserveAspectRatio="xMidYMid meet">
    <!-- Left G: opening to the right -->
    <path fill="#F0EDE5" fill-rule="evenodd" d="
      M16,0 L84,0 L100,16 L100,84 L84,100 L16,100 L0,84 L0,16 Z
      M28,28 L100,28 L100,44 L50,44 L50,72 L28,72 Z
    "/>
    <!-- Right G: mirrored, opening to the left -->
    <path fill="#F0EDE5" fill-rule="evenodd" d="
      M124,0 L192,0 L208,16 L208,84 L192,100 L124,100 L108,84 L108,16 Z
      M180,28 L108,28 L108,44 L158,44 L158,72 L180,72 Z
    "/>
  </svg>
</svg>
