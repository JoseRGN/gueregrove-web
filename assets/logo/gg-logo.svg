<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 206 100" fill="none" role="img" aria-label="GuereGrove">
  <title>GuereGrove</title>
  <defs>
    <!-- Octagon clips — chamfer C=14, letter 100×100 -->
    <clipPath id="L">
      <polygon points="14,0 86,0 100,14 100,86 86,100 14,100 0,86 0,14"/>
    </clipPath>
    <clipPath id="R">
      <polygon points="120,0 192,0 206,14 206,86 192,100 120,100 106,86 106,14"/>
    </clipPath>
  </defs>

  <!-- Left G  SW=21  ARM_Y=58  ARM_X=60 -->
  <g clip-path="url(#L)" fill="#F2F2F2">
    <rect width="100" height="21"/>
    <rect width="21" height="100"/>
    <rect y="79" width="100" height="21"/>
    <rect x="60" y="58" width="40" height="42"/>
  </g>

  <!-- Right G — horizontal mirror of Left G (gap=6, offset=106) -->
  <g clip-path="url(#R)" fill="#F2F2F2">
    <rect x="106" width="100" height="21"/>
    <rect x="185" width="21" height="100"/>
    <rect x="106" y="79" width="100" height="21"/>
    <rect x="106" y="58" width="40" height="42"/>
  </g>
</svg>
