<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 96" role="img" aria-label="Güeregrove">
  <title>GG — Güeregrove</title>
  <!--
    Barras gruesas 27% (26px), brazo corto 25% (desde columna hasta x=50),
    boca ancha (46px de abertura en x=50-96). Brazo visualmente más corto que
    las barras → se lee como G, no como E.
  -->

  <!-- G IZQUIERDA: boca abre derecha -->
  <path
    fill-rule="evenodd"
    fill="#F0EDE5"
    d="M 12,0  L 84,0  L 96,12 L 96,84 L 84,96 L 12,96 L 0,84  L 0,12  Z
       M 26,26 L 96,26 L 96,70 L 26,70 L 26,54 L 50,54 L 50,42 L 26,42 Z"
  />

  <!-- G DERECHA: boca abre izquierda (espejo exacto) -->
  <path
    fill-rule="evenodd"
    fill="#F0EDE5"
    d="M 116,0   L 188,0   L 200,12 L 200,84 L 188,96 L 116,96 L 104,84 L 104,12 Z
       M 174,26  L 104,26  L 104,70 L 174,70 L 174,54 L 150,54 L 150,42 L 174,42 Z"
  />
</svg>
